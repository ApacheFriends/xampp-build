            extra_binaries: |
                https://sourceforge.net/projects/xampp/files/thirdparties/20261103/curl-ca-bundle-2026-11-05.crt 427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285
                https://sourceforge.net/projects/xampp/files/xampp-skeleton/xampp-mariadbdata-unix-10.11-0.tar.gz d6a2cc659a5dd03fb887923e9c448471e5c0b9ccd0e4c7ea1af4e5932a650802
